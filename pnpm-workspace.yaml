packages:
  - .
allowBuilds:
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  es5-ext: true
  esbuild: true
  fsevents: true
  unrs-resolver: true
# pnpm ≥12 re-installs before running any script (`verify-deps-before-run`), which
# silently reverts a local `node_modules/audio-engine` link back to the github
# dependency — so `pnpm engine:link` would stop taking effect after the next
# `pnpm typecheck`/`lint`/`dev`. Turn that off; run `pnpm install` yourself after
# editing dependencies. Vercel installs explicitly, so this doesn't affect deploys.
verifyDepsBeforeRun: false
# NOTE: do NOT add an `overrides: { audio-engine: link:../audio-engine }` entry here.
# Overrides apply on Vercel too, where the sibling checkout does not exist — the
# install then produces a dangling symlink and the build fails with
# "Module not found: Can't resolve 'audio-engine'". `pnpm link ../audio-engine` writes
# this block back automatically, so use `pnpm engine:link` (local dev only) instead.
